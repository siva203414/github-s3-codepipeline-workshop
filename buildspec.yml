version: 0.2

phases:
  install:
    commands:
      - echo "No installation needed for static HTML"

  pre_build:
    commands:
      - echo "Preparing build..."

  build:
    commands:
      - echo "Building static HTML site"
      - mkdir -p output
      - find . -mindepth 1 -maxdepth 1 ! -name output ! -name buildspec.yml -exec cp -r {} output/ \;

  post_build:
    commands:
      - echo "Build complete"
      - echo "Uploading website to S3..."
      - aws s3 sync output/ s3://github-workshop-project-203414/
      - echo "S3 deployment completed"

artifacts:
  files:
    - '**/*'
  base-directory: output
  discard-paths: no
